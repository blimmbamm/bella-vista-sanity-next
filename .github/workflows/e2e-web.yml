name: E2E Web

# Always run so required status checks get a result. Tests only run when
# web/, e2e/, or this workflow changed; otherwise the job exits green early.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_SANITY_PROJECT_ID: gcuffsea
      NEXT_PUBLIC_SANITY_DATASET: development
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_NAME: Trattoria Bella Vista
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            e2e:
              - 'web/**'
              - 'e2e/**'
              - '.github/workflows/e2e-web.yml'

      - name: Skip notice
        if: steps.filter.outputs.e2e != 'true'
        run: echo 'No changes in web/, e2e/, or this workflow — skipping tests.'

      - name: Setup Node
        if: steps.filter.outputs.e2e == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json

      - name: Install web dependencies
        if: steps.filter.outputs.e2e == 'true'
        working-directory: web
        run: npm ci

      - name: Install e2e dependencies
        if: steps.filter.outputs.e2e == 'true'
        working-directory: e2e
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.filter.outputs.e2e == 'true'
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        if: steps.filter.outputs.e2e == 'true'
        working-directory: e2e
        run: npm test

      - name: Upload Playwright report
        if: failure() && steps.filter.outputs.e2e == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
